  <script>
    /* শেয়ার করা লিঙ্ক থেকে খুললে সাইটের লোগো (preloader) একবারও না দেখিয়ে
       সরাসরি ওই ভিডিওর থাম্বনেইল দেখানো। ভিডিওর আইডি URL-এ থাকলেই ধরা হয় —
       ?v= / ?startapp= / ?tgWebAppStartParam= (টেলিগ্রাম যেভাবেই পাঠাক)। */
    (function () {
      var found = false;
      try {
        var names = ['v', 'startapp', 'tgWebAppStartParam', 'start_param'];
        var sources = [new URLSearchParams(window.location.search)];
        if (window.location.hash && window.location.hash.length > 1) {
          sources.push(new URLSearchParams(window.location.hash.slice(1)));
        }
        found = sources.some(function (p) {
          return names.some(function (n) { return !!p.get(n); });
        });
      } catch (e) {}
      if (found && document.documentElement) {
        document.documentElement.className += ' deeplink-open';
      }
    })();
  </script>

  <script>
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.onkeydown = function (e) {
      if (e.keyCode == 123) { return false; }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) { return false; }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) { return false; }
      if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) { return false; }
      if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) { return false; }
      if (e.ctrlKey && e.keyCode == 'S'.charCodeAt(0)) { return false; }
    };

    document.addEventListener('wheel', function(e){ if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
    document.addEventListener('gesturechange', function(e){ e.preventDefault(); });
    document.addEventListener('touchmove', function(e){ if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    var __lastTouchEnd = 0;
    document.addEventListener('touchend', function(e){
      var now = Date.now();
      if (now - __lastTouchEnd <= 300) e.preventDefault();
      __lastTouchEnd = now;
    }, false);

    window.addEventListener('load', function() {
      setTimeout(function() {
        var preloader = document.getElementById('preloader');
        if (preloader) {
          preloader.classList.add('preloader-hidden');
        }
      }, 2500); 
    });
  </script>
